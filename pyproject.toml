[project]
name = "ur5vla"
version = "0.1.0"
description = "One control loop for a CB3 UR5 under an openpi or LeRobot VLA policy, for A/B comparison"
readme = "README.md"
# ur_rtde ships Linux wheels only up to cp312.
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "ur_rtde>=1.6",
    # Robotiq 2F-85 over its USB/RS-485 adapter (Modbus RTU). No numpy, so both venvs take it.
    "minimalmodbus>=2.1",
    "pyserial>=3.5",
]

[project.optional-dependencies]
cameras = [
    "pyrealsense2>=2.55",
    "depthai>=3.0",
    "opencv-python-headless>=4.9",
]
# The two policy clients pin incompatible numpy majors (openpi-client <2, lerobot >=2), so each
# gets its own venv. See README "Install".
# openpi-client imports typing_extensions without declaring it. websockets>=17 for the direct
# (legacy=True) sync connection the openpi backend opens itself.
openpi = ["openpi-client", "typing-extensions", "websockets>=17"]
# torch/torchvision are listed so the CPU-index source below applies: the client only unpickles
# action tensors. The LeRobot policy server runs from its own environment.
lerobot = ["lerobot[async,dataset]>=0.6,<0.7", "torch", "torchvision"]

[project.scripts]
ur5vla = "ur5vla.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
conflicts = [[{ extra = "openpi" }, { extra = "lerobot" }]]

[tool.uv.sources]
# The PyPI "openpi-client" has no listed maintainer; take it from Physical Intelligence's repo.
openpi-client = { git = "https://github.com/Physical-Intelligence/openpi.git", subdirectory = "packages/openpi-client" }
torch = [{ index = "pytorch-cpu", extra = "lerobot" }]
torchvision = [{ index = "pytorch-cpu", extra = "lerobot" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A crash in the exec/inference/recorder threads must fail the test, not just warn.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
