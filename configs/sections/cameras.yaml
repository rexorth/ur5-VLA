# Each camera is picked by its vendor ID, not a /dev/video node: OAKs have no video node, and node
# numbers change between boots. null = the first one found (fine with one of each type). To list:
#   realsense: rs-enumerate-devices -s   (the "Serial Number" column, not the /dev/v4l/by-id one)
#   oak:       python -c "import depthai as dai; print([d.getDeviceId() for d in dai.Device.getAllAvailableDevices()])"
# Both stream colour: RealSense its RGB sensor (rgb8), OAK the sensor on `socket` (CAM_A on an
# OAK-D: the IMX378; CAM_B/CAM_C are the mono stereo pair). Close OAK Viewer first: one program
# at a time can hold an OAK.
# rotate (0/90/180/270, clockwise) turns a camera mounted on its side upright; with 90 or 270 the
# frames are `width` tall. Fix it before recording demos: a model expects the view it was
# trained on.
cameras:
  # Image settings (docs/procedures.md#image-settings). Focus is fixed, autofocus never runs: the
  # OAK's 107 was measured with `ur5vla cameras --measure` on 2026-10-23.Every recorded frame keeps the
  # values it was taken with. Exposure steps with the 50 Hz mains so the lights don't flicker, and
  # the OAK's stays under 20 ms to limit motion blur (the D415's can't be capped below 33 ms).
  base:  {type: oak, device_id: "14442C10F10E3BD400", width: 640, height: 480, fps: 30,       # OAK-D (33: deliver a steady >=30; ~33 is the sustained ceiling)
          # LOCKED to the demo-run averages (58768 frames across 88 demo episodes): auto-exposure sat
          # at the 20 ms cap the whole time, iso floated ~697, white balance ~3370 K. Fixed so the
          # policy sees the same image it was trained on (no auto drift / settle). Was: max_exposure_us 20000.
          focus: 107, exposure_us: 16666, iso: 1000, white_balance_k: 3370, mains_hz: 50}
  wrist: {type: realsense, serial: "234422064578", width: 640, height: 480, fps: 30,         # D415, fixed focus
          # LOCKED to a 30s live read of its auto values (exposure 16600 us, gain 64, WB 4600 K). The
          # D415 doesn't record its auto choices, so no demo data existed; measured under the current
          # (night) light, which matches when the demos were collected. Fixes the auto-exposure settle.
          exposure_us: 16666, gain: 96, white_balance_k: 4000, mains_hz: 50}
  # base2 is the SECOND OAK, used ONLY by the 3-cam/30 Hz models (#5-#7). It is commented out while
  # testing the 2-cam models so only ONE OAK streams (two OAK-Ds on the current USB hubs brown out
  # and crash). RE-ENABLE this line before testing any 3cam30 model, and first fix the USB power:
  # put each OAK on its own powered USB3 port (not the Anker/StarTech bus-powered hubs).
  base2: {type: oak, device_id: "14442C10B19060D700", width: 640, height: 480, fps: 30, focus: 107, exposure_us: 16666, iso: 1000, white_balance_k: 3370, mains_hz: 50}