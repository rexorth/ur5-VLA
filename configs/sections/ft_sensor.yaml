# ATI Axia80 force/torque sensor between the flange and the gripper: Ethernet (UDP streaming), 24 V.
# Set it up (rate, filter, range, IP) with ~/abhay_ws/Axia80Monitor, then close that program: the
# sensor streams to one client at a time. Mounting it moves the gripper out from the flange: update
# safety.tcp_offset_m and the pendant's payload (mass, centre of gravity) first.
ft_sensor:
  type: axia80                # none | axia80. Calibration SI-150-8 (cfgcalsel 0): 111 N Fx/Fy, 493 N Fz, 5/5/8 N·m
  host: 192.168.10.133        # Axia80Monitor's config.yaml has the address
  # The calibration pose, joint degrees: before each demo (and `ur5vla prepare`) the arm moves here
  # and the sensor is zeroed, so it must be still and touching nothing, with the gripper empty.
  # Drive it there with `ur5vla teleop`, which prints the line to paste when it ends.
  tare_q_deg: [0, -90.00, -90.00, -90.00, 90.00, 0.00]
