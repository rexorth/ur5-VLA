# The UR5 cell. This is now a thin alias for configs/default.yaml, which is the master that pulls in
# the per-section files under configs/sections/ (robot, cameras, control, safety, teleop, gripper,
# ft_sensor, leader, sim, logging). It is kept so existing commands and docs that pass
# `-c configs/cell.yaml` keep working; default.yaml is also the config used when no -c is given.
#
#   ur5vla run -p configs/policy/openpi.yaml --prompt "..."
#   ur5vla run -c configs/cell.yaml -p configs/policy/openpi.yaml --prompt "..."   # same thing
#
# Edit the sections under configs/sections/, or override one here below this include line.
include: [default.yaml]
