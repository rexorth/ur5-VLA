# The UR5 cell: robot, cameras, control, safety, logging. Every run uses this file, openpi or
# LeRobot alike; the policy comes from a separate one:
#
#   ur5vla run -c configs/cell.yaml -p configs/policy/openpi.yaml --prompt "..."

robot:
  ip: 192.168.10.125          # CB3 UR5. No External Control URCap program may be running.
  rate_hz: 125                # CB3 RTDE maximum
  servoj: {lookahead: 0.1, gain: 300}
  start_q_deg: null           # teach and set before A/B runs: every trial starts here
  move_speed_deg_s: 20
  move_accel_deg_s2: 40

# Each camera is picked by its vendor ID, not a /dev/video node: OAKs have no video node, and node
# numbers change between boots. null = the first one found (fine with one of each type). To list:
#   realsense: rs-enumerate-devices -s   (the "Serial Number" column, not the /dev/v4l/by-id one)
#   oak:       python -c "import depthai as dai; print([d.getDeviceId() for d in dai.Device.getAllAvailableDevices()])"
# Both stream colour: RealSense its RGB sensor (rgb8), OAK the sensor on `socket` (CAM_A on an
# OAK-D: the IMX378; CAM_B/CAM_C are the mono stereo pair). Close OAK Viewer first: one program
# at a time can hold an OAK.
# rotate (0/90/180/270, clockwise) turns a camera mounted on its side upright; with 90 or 270 the
# frames are `width` tall. Fix it before recording demos: a model expects the view it was
# trained on.
cameras:
  base:  {type: oak, device_id: "14442C10F10E3BD400", width: 640, height: 480, fps: 30, rotate: 90}  # OAK-D, on its side
  wrist: {type: realsense, serial: "234422064578", width: 640, height: 480, fps: 30}      # D415

control:
  refill_fraction: 0.5        # ask for a chunk when half the last one is left
  crossfade_steps: 5
  max_episode_s: 120

# Our limits act first and gently (a refused target is never sent); the pendant's safety
# configuration is the backstop. Keep each of these inside its pendant counterpart:
# docs/procedures.md#25-safety-limits-the-pendant-and-cellyaml-together
safety:
  max_step_rad: 0.02          # per 8 ms tick, any joint: 0.02 rad = 143 deg/s
  max_tcp_speed_m_s: 0.5      # at tcp_offset_m; null = off
  max_tracking_error_deg: 15  # target vs. where the arm is: larger = the robot is slowing itself
  ft_limit_n: 30              # CB3: on the controller's joint-current wrench ESTIMATE, tared per episode
  # Watchdog: hold if the next chunk is overdue. After each chunk the next is expected
  # ~(1 - refill_fraction) * chunk duration later (or after one latency, if the server is slower
  # than that); the watchdog allows watchdog_factor times that.
  watchdog_factor: 1.5
  # Optional hard cap on the watchdog window, s: the longest the arm may keep moving without a
  # fresh chunk. null = no cap (then the bound is watchdog_factor x the expected gap).
  watchdog_max_s: null
  max_frame_age_s: 0.1
  # SET PER TASK before running on the arm. These defaults are the UR5's own range and a loose box.
  joint_min_deg: [-360, -360, -360, -360, -360, -360]
  joint_max_deg: [360, 360, 360, 360, 360, 360]
  workspace_min_m: [-0.9, -0.9, -0.05]   # UR base frame, as the pendant shows it
  workspace_max_m: [0.9, 0.9, 1.0]
  tcp_offset_m: [0, 0, 0]               # flange -> fingertip once a gripper is mounted

# Gamepad teleoperation (`ur5vla teleop`, `ur5vla demo`). Numbers below are an Xbox One pad over
# USB (xpad driver); run `ur5vla gamepad -c configs/cell.yaml` to see yours live. Each robot axis
# is a sum of terms, clipped to [-1, 1]: {axis: i}, {axis: i, trigger: true} (0..1), {button: i},
# each with an optional sign: -1. Listing a robot axis replaces its default; leave one out = unused.
teleop:
  device: null                # /dev/input/jsN; null = the first joystick found
  frame: base                 # starting frame (base | tool); the toggle_frame button flips it
  max_linear_m_s: 0.05        # at full deflection; deliberately slow for bring-up
  max_angular_deg_s: 15
  linear_accel_m_s2: 0.5
  angular_accel_deg_s2: 90
  max_joint_speed_deg_s: 45
  slow_scale: 0.25            # while the slow button is held
  deadzone: 0.12
  curve: 1.5                  # stick response |x|^curve: finer near the center
  axes:
    x:  [{axis: 1, sign: -1}]                                         # left stick up/down
    y:  [{axis: 0, sign: -1}]                                         # left stick left/right
    z:  [{axis: 5, trigger: true}, {axis: 2, trigger: true, sign: -1}]  # RT up, LT down
    rx: [{axis: 4, sign: -1}]                                         # right stick up/down
    ry: [{axis: 3, sign: -1}]                                         # right stick left/right
    rz: [{axis: 6, sign: -1}]                                         # d-pad left/right
  gripper: [{button: 0}, {button: 1, sign: -1}]                       # A close, B open
  buttons: {deadman: 4, slow: 5, toggle_frame: 6, done: 7}            # LB (hold), RB, View, Menu

# Robotiq 2F-85 on its USB/RS-485 adapter (Modbus RTU), driven every tick like the arm: teleop's
# A/B and the policy's gripper action both arrive as 0 open .. 1 closed. `ur5vla gripper` tests it.
gripper:
  type: robotiq_2f85          # none | robotiq_2f85
  port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG01X8DU-if00-port0
  slave_id: 9
  speed: 1.0                  # 0..1 = 20..150 mm/s
  force: 0.5                  # 0..1 = 20..235 N
  timeout_s: 0.5              # no status for this long ends the episode

logging:
  root: runs
  image_format: jpg
  jpeg_quality: 95

prompt: ""
